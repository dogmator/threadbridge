name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: threadbridge
          POSTGRES_USER: threadbridge
          POSTGRES_PASSWORD: threadbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U threadbridge -d threadbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://threadbridge:threadbridge@localhost:5432/threadbridge

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Resolve dependencies
        run: npm install

      - name: Finalize dependency lock
        if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/publication-flow-clarity'
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/ci.yml')
          text = workflow.read_text()
          text = text.replace('permissions:\n  contents: write', 'permissions:\n  contents: read')
          start = text.index('      - name: Resolve dependencies\n')
          end = text.index('      - name: Run checks\n', start)
          replacement = "      - name: Install dependencies\n        run: npm ci\n\n"
          workflow.write_text(text[:start] + replacement + text[end:])
          PY
          git config user.name dogmator
          git config user.email dogmatum@gmail.com
          git add package-lock.json .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "build: lock fastify dependencies"
          git push origin HEAD:refactor/publication-flow-clarity

      - name: Run checks
        run: npm run check
