name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: threadbridge
          POSTGRES_USER: threadbridge
          POSTGRES_PASSWORD: threadbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U threadbridge -d threadbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://threadbridge:threadbridge@localhost:5432/threadbridge

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Resolve dependencies
        run: npm install

      - name: Upload dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Run checks
        run: npm run check
